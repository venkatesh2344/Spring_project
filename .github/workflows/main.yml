name: CI/CD Pipeline

# When the workflow should run
on:
  push:
    branches:
      - main    # Runs when code is pushed to main
  pull_request:
    branches:
      - main

# Define what the pipeline does
jobs:
  build:
    runs-on: ubuntu-latest   # Use latest Ubuntu machine

    steps:
      # Step 1: Checkout the source code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java (adjust version if needed)
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Cache Maven dependencies (speeds up future builds)
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      # Step 4: Build the app
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # Step 5: Run tests (optional)
      - name: Run Tests
        run: mvn test

      # Step 6: Upload build artifact (optional)
      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
